[graph]
targets = []

[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0119", # number_prefix, unmaintained — transitive via indicatif->tokenizers, not a vulnerability
    "RUSTSEC-2024-0436", # paste, unmaintained — transitive via tokenizers, not a vulnerability
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
