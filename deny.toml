[graph]
targets = []

[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0119", # number_prefix, unmaintained — transitive via indicatif->tokenizers
    "RUSTSEC-2024-0436", # paste, unmaintained — transitive via tokenizers
    "RUSTSEC-2024-0449", # unsafe-libyaml, unmaintained — transitive via serde_yaml
    "RUSTSEC-2026-0285", # rustls, transitive via reqwest (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0346", # rustls, transitive via reqwest (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0348", # rustls, transitive via reqwest (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0349", # rustls, transitive via reqwest (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0381", # webpki-roots, transitive via reqwest (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0382", # rustls-webpki, transitive via reqwest/ort (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0383", # webpki-root-certs, transitive via ort-sys->ureq (pinned in offline Cargo.lock)
    "RUSTSEC-2026-0386", # tokio AsyncFd, not used in this workspace (pinned in offline Cargo.lock)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
