services:
  ollama:
    image: ollama/ollama:latest
    container_name: redteam-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redteamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redteamer-cli
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - RUST_LOG=info
    volumes:
      - ./reports:/home/redteamer/reports
    command: [
      "scan",
      "--target", "ollama",
      "--base-url", "http://ollama:11434",
      "--model", "llama3.2",
      "--format", "html",
      "-o", "/home/redteamer/reports/report.html"
    ]

volumes:
  ollama_data:
