[workspace]
resolver = "2"
members = [
    "crates/redteamer-core",
    "crates/redteamer-adapters",
    "crates/redteamer-payload",
    "crates/redteamer-detectors",
    "crates/redteamer-orchestrator",
    "crates/redteamer-cli",
    "crates/redteamer-probes",
    "crates/redteamer-reporters",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/llm-redteamer"
rust-version = "1.85"

[workspace.dependencies]
redteamer-core = { path = "crates/redteamer-core" }
redteamer-adapters = { path = "crates/redteamer-adapters" }
redteamer-payload = { path = "crates/redteamer-payload" }
redteamer-detectors = { path = "crates/redteamer-detectors" }
redteamer-orchestrator = { path = "crates/redteamer-orchestrator" }
redteamer-cli = { path = "crates/redteamer-cli" }
redteamer-probes = { path = "crates/redteamer-probes" }
redteamer-reporters = { path = "crates/redteamer-reporters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
memchr = "2.7"
regex = "1.10"
inventory = "0.3"
handlebars = "6"
ort = "=2.0.0-rc.13"
tokenizers = "0.21"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
