name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev cmake

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build release binary (native)
        if: !matrix.use_cross
        run: cargo build --release -p redteamer-cli --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release -p redteamer-cli --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN_NAME="llm-redteamer"
          ARCHIVE_NAME="llm-redteamer-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          tar -czvf "../../../${ARCHIVE_NAME}" "${BIN_NAME}"
          cd ../../..
          if command -v sha256sum &>/dev/null; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          BIN_NAME="llm-redteamer.exe"
          ARCHIVE_NAME="llm-redteamer-${{ github.ref_name }}-${{ matrix.target }}.zip"
          cd "target/${{ matrix.target }}/release"
          7z a "../../../${ARCHIVE_NAME}" "${BIN_NAME}"
          cd ../../..
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            llm-redteamer-${{ github.ref_name }}-${{ matrix.target }}.*

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain for SBOM
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX 1.5 JSON SBOM
        run: |
          cargo cyclonedx --manifest-path crates/redteamer-cli/Cargo.toml --format json --spec-version 1.5 --override-filename llm-redteamer-${{ github.ref_name }}.cdx
          mv crates/redteamer-cli/llm-redteamer-${{ github.ref_name }}.cdx.json .

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          mv SHA256SUMS.txt ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "llm-redteamer ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*
            SHA256SUMS.txt
            llm-redteamer-${{ github.ref_name }}.cdx.json

  publish-docker:
    name: Build & Push Docker Image
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
